<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erhai Lake Road Trip Tracker</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: white;
            --text-main: #333;
            --text-sub: #666;
            --border-color: #eee;
            --chart-bg: #fafafa;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #aaa;
            --border-color: #333;
            --chart-bg: #252525;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 20px; background: var(--bg-color); margin: 0; transition: background 0.3s ease; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto 20px auto; transition: background 0.3s ease; }
        h1 { color: var(--text-main); margin-top: 0; font-size: 1.5rem; }
        p { font-size: 1.2rem; color: var(--text-sub); margin: 10px 0; display: flex; justify-content: space-between; padding: 0 10px; }
        .value { font-weight: bold; color: #007BFF; }
        .geo-value { color: #28a745; font-weight: bold; }
        .dist-value { color: #e67e22; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn { background: #007BFF; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; max-width: 140px; font-weight: bold; }
        .btn-toggle { background: #6f42c1; max-width: 180px; }
        .chart-container { max-width: 500px; margin: 0 auto 30px auto; background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { background: var(--chart-bg); border-radius: 6px; width: 100%; height: 150px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Erhai Lake Tracker 🏔️</h1>
        <p><span>Timer:</span> <span id="timer" class="value">00:00:00</span></p>
        <p><span>Total Distance:</span> <span id="distance" class="dist-value">0.00 km</span></p>
        <p><span>Altitude:</span> <span id="altitude" class="value">Waiting for GPS...</span></p>
        <p><span>Speed:</span> <span id="speed" class="value">-</span></p>
        <p><span>Accuracy:</span> <span id="accuracy" class="value">-</span></p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <p style="font-size: 1rem;"><span>Latitude:</span> <span id="lat" class="geo-value">-</span></p>
        <p style="font-size: 1rem;"><span>Longitude:</span> <span id="lng" class="geo-value">-</span></p>
        
        <div class="btn-group">
            <button class="btn" id="unitBtn">To Feet</button>
            <button class="btn btn-toggle" id="themeBtn">🌙 Dark Mode</button>
        </div>
    </div>

    <div class="chart-container">
        <p style="font-size: 0.9rem; color: var(--text-sub); margin-top: 0; font-weight: bold;">Altitude Profile</p>
        <canvas id="customChart" width="400" height="150"></canvas>
    </div>

    <script>
        let useMetric = true;
        let altitudeHistory = [];
        let totalDistanceKm = 0;
        let lastLat = null;
        let lastLng = null;
        let startTime = Date.now();
        
        const canvas = document.getElementById('customChart');
        const ctx = canvas.getContext('2d');

        // Timer
        setInterval(() => {
            const elapsed = Date.now() - startTime;
            const hrs = String(Math.floor(elapsed / 3600000)).padStart(2, '0');
            const mins = String(Math.floor((elapsed % 3600000) / 60000)).padStart(2, '0');
            const secs = String(Math.floor((elapsed % 60000) / 1000)).padStart(2, '0');
            document.getElementById("timer").textContent = `${hrs}:${mins}:${secs}`;
        }, 1000);

        // Mathematical calculation for live distance tracker
        function getDistanceHaversine(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (altitudeHistory.length < 2) return;
            const min = Math.min(...altitudeHistory) * 0.99;
            const max = Math.max(...altitudeHistory) * 1.01;
            const range = max - min === 0 ? 1 : max - min;
            ctx.beginPath();
            ctx.strokeStyle = '#007BFF';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            for (let i = 0; i < altitudeHistory.length; i++) {
                const x = (i / (altitudeHistory.length - 1)) * canvas.width;
                const y = canvas.height - ((altitudeHistory[i] - min) / range) * canvas.height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    let alt = position.coords.altitude;
                    let acc = position.coords.altitudeAccuracy;
                    let speed = position.coords.speed;
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    if (alt !== null) {
                        let displayAlt = useMetric ? alt : alt * 3.28084;
                        let altUnit = useMetric ? "meters" : "feet";
                        let displaySpeed = "-";
                        
                        if (speed !== null && speed > 0) {
                            displaySpeed = useMetric ? `${(speed * 3.6).toFixed(1)} km/h` : `${(speed * 2.23694).toFixed(1)} mph`;
                        }
                        
                        // Live Distance Accumulator
                        if (lastLat !== null && lastLng !== null) {
                            const d = getDistanceHaversine(lastLat, lastLng, lat, lng);
                            if (position.coords.accuracy < 30 && d > 0.002) { 
                                totalDistanceKm += d;
                            }
                        }
                        lastLat = lat;
                        lastLng = lng;

                        let displayDist = useMetric ? `${totalDistanceKm.toFixed(2)} km` : `${(totalDistanceKm * 0.621371).toFixed(2)} mi`;
                        let displayAcc = acc !== null ? `±${(useMetric ? acc : acc * 3.28084).toFixed(1)} ${altUnit}` : "N/A";

                        document.getElementById("distance").textContent = displayDist;
                        document.getElementById("altitude").textContent = `${displayAlt.toFixed(1)} ${altUnit}`;
                        document.getElementById("speed").textContent = displaySpeed;
                        document.getElementById("accuracy").textContent = displayAcc;
                        document.getElementById("lat").textContent = lat.toFixed(5);
                        document.getElementById("lng").textContent = lng.toFixed(5);

                        altitudeHistory.push(displayAlt);
                        if (altitudeHistory.length > 30) altitudeHistory.shift();
                        drawGraph();
                    }
                },
                (error) => {},
                { enableHighAccuracy: true }
            );
        }

        document.getElementById("unitBtn").addEventListener("click", () => {
            useMetric = !useMetric;
            document.getElementById("unitBtn").textContent = useMetric ? "To Feet" : "To Meters";
            altitudeHistory = altitudeHistory.map(val => useMetric ? val / 3.28084 : val * 3.28084);
            drawGraph();
        });

        document.getElementById("themeBtn").addEventListener("click", () => {
            const isDark = document.body.getAttribute("data-theme") === "dark";
            document.body.setAttribute("data-theme", isDark ? "light" : "dark");
            document.getElementById("themeBtn").textContent = isDark ? "🌙 Dark Mode" : "☀️ Light Mode";
            drawGraph();
        });
    </script>
</body>
</html>
